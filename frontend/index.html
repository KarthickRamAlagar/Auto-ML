<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Auto ML: chat-guided machine learning, from data to verdict</title>
    <meta name="description" content="Pick a domain, find or upload a dataset and train classification or regression models with guided EDA, preprocessing and tuning. Free for 10 models. Datasets are never stored." />
    <meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#262624" media="(prefers-color-scheme: dark)" />
    <link rel="canonical" href="__SITE_URL__/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Auto ML" />
    <meta property="og:title" content="Auto ML: chat-guided machine learning" />
    <meta property="og:description" content="Guided EDA, preprocessing, tuning and a final verdict on the best model for your data." />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Auto ML",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Web",
        "description": "A chat-style AutoML workspace for classification and regression with guided EDA, preprocessing, tuning and reports.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "INR" }
      }
    </script>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem("automl-theme") || "system";
        var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!--seo-fallback-->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
